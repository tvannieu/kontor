# Task profiles for the demo sandbox. The model names match the ones declared
# in demo/sandbox/crush.json, so `kontor` can be run against this directory
# without touching a real branch or a real config.
#
#   profile <name>  <large model>  <small model>  "<what kind of work this is>"

profile filing    ollama/kontor-4b:latest   ollama/kontor-4b:latest   "Filing, renaming, recording. No judgement required."
profile reading   ollama/kontor-8b:latest   ollama/kontor-4b:latest   "Search and summarise, locally. Nothing leaves the machine."
profile drafting  hyper/qwen3.8-flash       hyper/qwen3.8-flash       "Drafts and correspondence. Cheap hosted tier."
profile analysis  hyper/glm-5.3             hyper/qwen3.8-flash       "Hard work. Expensive, chosen deliberately."
